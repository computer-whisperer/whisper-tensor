# Model accuracy validation registry.
#
# Each model entry defines:
#   - reference_script: Python script in ci/accuracy/references/ to generate golden outputs
#   - model_path: Path to model file (relative to repo root, or absolute for Ceph)
#   - tier: 1 (quick, <5min), 2 (moderate, <1hr), 3 (full, hours)
#   - rtol/atol: Tolerance for accuracy comparison
#   - reference: What first-party implementation is used as ground truth

[gpt2]
reference_script = "gpt2_onnxrt.py"
model_path = "test_models/gpt2-lm-head-10.onnx"
tier = 1
rtol = 1e-5
atol = 1e-5
reference = "onnxruntime (same ONNX graph)"
notes = "Pre-exported ONNX model, reference is ORT on identical graph"

[rwkv7]
reference_script = "rwkv7_reference.py"
model_path = "test_models/RWKV-x070-World-0.1B-v2.8-20241210-ctx4096.pth"
tier = 1
rtol = 1e-4
atol = 1e-4
reference = "official RWKV-7 implementation"
notes = "Loaded via identify_and_load (.pth -> ONNX); reference is official RWKV7 inference"


stages:
  - lint
  - build
  - test
  - validate

variables:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Submodules are checked out manually in before_script because
  # .gitmodules contains SSH URLs that fail in the runner container.
  GIT_SUBMODULE_STRATEGY: none
  # Features to test (everything except vulkan and tch which need
  # heavy system deps not yet available in the runner image)
  CI_FEATURES: "tokenizers,rwkv-tokenizer,http,blas,safetensors,cranelift"

default:
  image: docker.io/library/rust:latest
  before_script:
    # Rewrite SSH submodule URLs to HTTPS so the runner can clone without keys
    - git config --global url."https://github.com/".insteadOf "git@github.com:"
    - git submodule update --init --recursive
    - apt-get update -qq && apt-get install -y -qq protobuf-compiler libopenblas-dev > /dev/null

# ---------------------------------------------------------------------------
# Lint stage
# ---------------------------------------------------------------------------

format:
  stage: lint
  before_script:
    - git config --global url."https://github.com/".insteadOf "git@github.com:"
    - git submodule update --init --recursive
    - rustup component add rustfmt
    - apt-get update -qq && apt-get install -y -qq protobuf-compiler jq > /dev/null
  script:
    - |
      META=$(cargo metadata --no-deps --format-version 1)
      PKGS=$(echo "$META" | jq -r '.packages[] | select(.manifest_path | test("/libs/") | not) | .name')
      FMT_ARGS=""
      for p in $PKGS; do FMT_ARGS="$FMT_ARGS -p $p"; done
      cargo fmt $FMT_ARGS -- --check

clippy:
  stage: lint
  script:
    - rustup component add clippy
    - cargo clippy -p whisper-tensor --no-deps --features "$CI_FEATURES" -- -D warnings
    - cargo clippy -p whisper-tensor-server --no-deps --features "import,cranelift" -- -D warnings
    - cargo clippy -p whisper-tensor-import --no-deps --all-features -- -D warnings

# ---------------------------------------------------------------------------
# Build stage
# ---------------------------------------------------------------------------

build:
  stage: build
  script:
    - cargo build -p whisper-tensor --lib --locked --verbose
    - cargo build -p whisper-tensor --lib --locked --verbose --features "$CI_FEATURES"
    - cargo build -p whisper-tensor-server --locked --verbose

# ---------------------------------------------------------------------------
# Test stage
# ---------------------------------------------------------------------------

test:
  stage: test
  script:
    - cargo test -p whisper-tensor --features "$CI_FEATURES" --locked --verbose

# ---------------------------------------------------------------------------
# Validate stage — model accuracy against reference implementations
# ---------------------------------------------------------------------------
# These jobs run on the high-cpu runner (c-srv3) with access to /models (Ceph)
# and are triggered manually. Each model is a separate job for independent
# re-runs and parallel execution.

.validate-model:
  stage: validate
  when: manual
  tags:
    - high-cpu
  image: registry.cjbal.com/whisper-tensor/accuracy:latest
  variables:
    GOLDEN_DIR: /tmp/golden
    ACCURACY_REPORT_DIR: ${CI_PROJECT_DIR}/accuracy-reports
    HF_HOME: /hf-cache
  before_script:
    - git config --global url."https://github.com/".insteadOf "git@github.com:"
    - git submodule update --init --recursive
    - git lfs install && git lfs pull
    - mkdir -p ${GOLDEN_DIR} ${ACCURACY_REPORT_DIR}
  artifacts:
    paths:
      - accuracy-reports/
    when: always
    expire_in: 90 days

validate-gpt2:
  extends: .validate-model
  variables:
    MODEL_NAME: gpt2
  script:
    - python3 ci/accuracy/references/gpt2_onnxrt.py
        --model test_models/gpt2-lm-head-10.onnx
        --output ${GOLDEN_DIR}/gpt2
    - cargo test --release -p whisper-tensor
        --features "${CI_FEATURES}"
        --test accuracy accuracy_gpt2
        -- --nocapture
